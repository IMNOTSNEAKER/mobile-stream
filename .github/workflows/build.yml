name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libreadline-dev \
            libsqlite3-dev \
            libssl-dev \
            libffi-dev \
            cmake \
            ninja-build \
            lld \
            clang \
            ccache \
            gfortran \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libjpeg-dev \
            libpng-dev

          python -m pip install --upgrade pip setuptools wheel
          python -m pip install \
            "Cython==0.29.36" \
            virtualenv \
            buildozer

      - name: Configure buildozer.spec
        shell: bash
        run: |
          # Do not run "buildozer init" when the project already has a spec file.
          if [ ! -f buildozer.spec ]; then
            buildozer init
          fi

          python3 - <<'PY'
          import re

          path = "buildozer.spec"

          with open(path, "r", encoding="utf-8") as file:
              content = file.read()

          replacements = [
              (r"^#?\s*title\s*=.*$",
               "title = MobileStream"),
              (r"^#?\s*package\.name\s*=.*$",
               "package.name = mobilestream"),
              (r"^#?\s*package\.domain\s*=.*$",
               "package.domain = org.imnotsneaker"),
              (r"^#?\s*requirements\s*=.*$",
               "requirements = python3,kivy,flask,requests,pillow"),
              (r"^#?\s*android\.permissions\s*=.*$",
               "android.permissions = INTERNET"),
              (r"^#?\s*android\.archs\s*=.*$",
               "android.archs = arm64-v8a"),
              (r"^#?\s*android\.api\s*=.*$",
               "android.api = 35"),
              (r"^#?\s*android\.minapi\s*=.*$",
               "android.minapi = 23"),
              (r"^#?\s*android\.ndk\s*=.*$",
               "android.ndk = 25b"),
              (r"^#?\s*android\.accept_sdk_license\s*=.*$",
               "android.accept_sdk_license = True"),
              (r"^#?\s*log_level\s*=.*$",
               "log_level = 2"),
          ]

          for pattern, replacement in replacements:
              updated, count = re.subn(
                  pattern,
                  replacement,
                  content,
                  count=1,
                  flags=re.MULTILINE,
              )

              # Fail early instead of silently ignoring a missing setting.
              if count == 0:
                  raise RuntimeError(
                      f"Could not find buildozer.spec setting: {pattern}"
                  )

              content = updated

          with open(path, "w", encoding="utf-8") as file:
              file.write(content)
          PY

          echo "===== Effective buildozer.spec settings ====="
          grep -E "^(title|package\.name|package\.domain|requirements|android\.permissions|android\.archs|android\.api|android\.minapi|android\.ndk|log_level)[[:space:]]*=" buildozer.spec

          if grep -q "requirements = .*openssl.*libffi" buildozer.spec; then
            echo "ERROR: old openssl/libffi requirements are still present"
            exit 1
          fi

      - name: Build debug APK
        run: |
          # GitHub-hosted runners export a different NDK through these names.
          # Buildozer uses ANDROIDNDK internally, so avoid mixing both setups.
          unset ANDROID_NDK
          unset ANDROID_NDK_HOME
          unset ANDROID_NDK_ROOT
          unset ANDROID_NDK_LATEST_HOME

          set -o pipefail
          buildozer -v android debug 2>&1 | tee buildozer.log

      - name: Upload Buildozer log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: buildozer.log
          if-no-files-found: ignore

      - name: Print build failure details
        if: failure()
        run: |
          echo "===== Likely failure lines ====="
          if [ -f buildozer.log ]; then
            grep -nEi "error:|exception|failed|fatal|traceback" \
              buildozer.log | tail -100 || true
            echo "===== Last 200 lines ====="
            tail -200 buildozer.log
          else
            echo "buildozer.log was not created"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bin/*.apk
          if-no-files-found: error
