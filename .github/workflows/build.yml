name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate buildozer.spec
        run: |
          pip install buildozer
          buildozer init
          sed -i 's/# title = My Application/title = MobileStream/' buildozer.spec
          sed -i 's/# package.name = myapp/package.name = mobilestream/' buildozer.spec
          sed -i 's/# package.domain = org.test/package.domain = org.imnotsneaker/' buildozer.spec
          sed -i 's/requirements = python3,kivy/requirements = python3,kivy,flask,opencv,requests,gevent/g' buildozer.spec

      - name: Build with Buildozer Action
        uses: kivy/buildozer-action@v1
        with:
          command: android debug
          subfolder: .

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bin/*.apk
