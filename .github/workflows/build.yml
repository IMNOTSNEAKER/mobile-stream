name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libreadline-dev libsqlite3-dev libssl-dev libffi-dev cmake ninja-build lld clang
          pip install --upgrade pip
          pip install buildozer cython

      - name: Configure buildozer.spec and Build
        env:
          ANDROID_NDK_HOME: ""
          ANDROID_NDK_ROOT: ""
          ANDROID_NDK: ""
          ANDROID_NDK_LATEST_HOME: ""
        run: |
          buildozer init
          
          # استبدال الإعدادات باستخدام Regex لتجنب تكرار الخيارات داخل buildozer.spec
          python3 -c "
          import re

          with open('buildozer.spec', 'r') as f:
              content = f.read()

          # استبدال القيم الحالية بدلاً من إضافتها من جديد
          content = re.sub(r'^#?\s*title\s*=.*', 'title = MobileStream', content, flags=re.MULTILINE)
          content = re.sub(r'^#?\s*package\.name\s*=.*', 'package.name = mobilestream', content, flags=re.MULTILINE)
          content = re.sub(r'^#?\s*package\.domain\s*=.*', 'package.domain = org.imnotsneaker', content, flags=re.MULTILINE)
          content = re.sub(r'^#?\s*requirements\s*=.*', 'requirements = python3,kivy,flask,numpy,opencv,requests', content, flags=re.MULTILINE)
          content = re.sub(r'^#?\s*android\.archs\s*=.*', 'android.archs = arm64-v8a', content, flags=re.MULTILINE)
          content = re.sub(r'^#?\s*android\.ndk\s*=.*', 'android.ndk = 25b', content, flags=re.MULTILINE)
          content = re.sub(r'^#?\s*android\.ndk_version\s*=.*', 'android.ndk_version = 25b', content, flags=re.MULTILINE)
          content = re.sub(r'^#?\s*android\.accept_sdk_license\s*=.*', 'android.accept_sdk_license = True', content, flags=re.MULTILINE)
          content = re.sub(r'^#?\s*log_level\s*=.*', 'log_level = 2', content, flags=re.MULTILINE)

          with open('buildozer.spec', 'w') as f:
              f.write(content)
          "

          # بدء عملية التجميع
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bin/*.apk
