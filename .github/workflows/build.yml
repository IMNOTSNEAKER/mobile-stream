name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Build Dependencies
        run: |
          sudo apt update -y
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libreadline-dev libsqlite3-dev \
            libssl-dev libffi-dev cmake ninja-build lld clang ccache gfortran \
            libgl1-mesa-dev libgles2-mesa-dev libjpeg-dev libpng-dev
          
          pip install --upgrade pip
          pip install "Cython==0.29.36" virtualenv buildozer

      - name: Configure buildozer.spec and Build
        env:
          ANDROID_NDK_HOME: ""
          ANDROID_NDK_ROOT: ""
          ANDROID_NDK: ""
          ANDROID_NDK_LATEST_HOME: ""
        run: |
          buildozer init
          
          python3 -c "
          import re

          with open('buildozer.spec', 'r') as f:
              content = f.read()

          replacements = [
              (r'^#?\s*title\s*=.*', 'title = MobileStream'),
              (r'^#?\s*package\.name\s*=.*', 'package.name = mobilestream'),
              (r'^#?\s*package\.domain\s*=.*', 'package.domain = org.imnotsneaker'),
              (r'^#?\s*requirements\s*=.*', 'requirements = python3,kivy,flask,requests,openssl,libffi,pillow'),
              (r'^#?\s*android\.permissions\s*=.*', 'android.permissions = INTERNET,READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE'),
              (r'^#?\s*android\.archs\s*=.*', 'android.archs = arm64-v8a'),
              (r'^#?\s*android\.ndk\s*=.*', 'android.ndk = 25b'),
              (r'^#?\s*android\.ndk_version\s*=.*', 'android.ndk_version = 25b'),
              (r'^#?\s*android\.accept_sdk_license\s*=.*', 'android.accept_sdk_license = True'),
              (r'^#?\s*log_level\s*=.*', 'log_level = 2'),
          ]

          for pattern, repl in replacements:
              content = re.sub(pattern, repl, content, count=1, flags=re.MULTILINE)

          with open('buildozer.spec', 'w') as f:
              f.write(content)
          "

          # بدء التجميع
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bin/*.apk
