name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf automake libtool libtool-bin libltdl-dev \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libreadline-dev \
            libsqlite3-dev libssl-dev libffi-dev cmake ninja-build lld clang ccache \
            gfortran libgl1-mesa-dev libgles2-mesa-dev libjpeg-dev libpng-dev

          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==0.29.36" virtualenv buildozer

      - name: Configure buildozer.spec
        run: |
          if [ ! -f buildozer.spec ]; then
            buildozer init
          fi
          sed -i 's/^title =.*/title = MobileStream/' buildozer.spec
          sed -i 's/^package.name =.*/package.name = mobilestream/' buildozer.spec
          sed -i 's/^package.domain =.*/package.domain = org.imnotsneaker/' buildozer.spec
          sed -i 's/^requirements =.*/requirements = python3,kivy,flask,requests,pillow/' buildozer.spec
          sed -i 's/^android.permissions =.*/android.permissions = INTERNET/' buildozer.spec
          sed -i 's/^android.archs =.*/android.archs = arm64-v8a/' buildozer.spec
          sed -i 's/^android.api =.*/android.api = 35/' buildozer.spec
          sed -i 's/^android.minapi =.*/android.minapi = 24/' buildozer.spec
          sed -i 's/^android.ndk =.*/android.ndk = 25b/' buildozer.spec
          sed -i 's/^android.ndk_api =.*/android.ndk_api = 24/' buildozer.spec
          sed -i 's/^android.accept_sdk_license =.*/android.accept_sdk_license = True/' buildozer.spec
          sed -i 's/^log_level =.*/log_level = 2/' buildozer.spec

      - name: Build debug APK
        run: |
          unset ANDROID_NDK ANDROID_NDK_HOME ANDROID_NDK_ROOT ANDROID_NDK_LATEST_HOME
          rm -rf .buildozer
          set -o pipefail
          buildozer -v android debug 2>&1 | tee buildozer.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bin/*.apk
          if-no-files-found: error
