name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libreadline-dev libsqlite3-dev libssl-dev libffi-dev cmake ninja-build lld clang
          pip install --upgrade pip
          pip install buildozer cython

      - name: Configure buildozer.spec and Build
        env:
          ANDROID_NDK_HOME: ""
          ANDROID_NDK_ROOT: ""
          ANDROID_NDK: ""
          ANDROID_NDK_LATEST_HOME: ""
        run: |
          buildozer init
          
          # تعديل ملف buildozer.spec باستخدام Python لضمان كتابة الإعدادات الصحيحة 100%
          python3 -c "
          with open('buildozer.spec', 'r') as f:
              lines = f.readlines()

          new_lines = []
          for line in lines:
              if line.startswith('title ='):
                  new_lines.append('title = MobileStream\n')
              elif line.startswith('package.name ='):
                  new_lines.append('package.name = mobilestream\n')
              elif line.startswith('package.domain ='):
                  new_lines.append('package.domain = org.imnotsneaker\n')
              elif line.startswith('requirements ='):
                  new_lines.append('requirements = python3,kivy,flask,numpy,opencv,requests\n')
              elif line.startswith('android.archs ='):
                  new_lines.append('android.archs = arm64-v8a\n')
              elif 'android.ndk =' in line or 'android.ndk_version =' in line:
                  continue
              else:
                  new_lines.append(line)

          # إضافة إعدادات NDK 25b والمستوى وتفاصيل السجل
          new_lines.append('\nandroid.ndk = 25b\n')
          new_lines.append('android.accept_sdk_license = True\n')
          new_lines.append('log_level = 2\n')

          with open('buildozer.spec', 'w') as f:
              f.writelines(new_lines)
          "

          # بدء عملية التجميع
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bin/*.apk
