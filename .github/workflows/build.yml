name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libreadline-dev libsqlite3-dev libssl-dev libffi-dev cmake ninja-build lld clang
          pip install --upgrade pip
          pip install buildozer cython

      - name: Build APK with Buildozer
        run: |
          buildozer init
          
          # 1. إعداد العنوان واسم الحزمة
          sed -i 's/^title =.*/title = MobileStream/' buildozer.spec
          sed -i 's/^package.name =.*/package.name = mobilestream/' buildozer.spec
          sed -i 's/^package.domain =.*/package.domain = org.imnotsneaker/' buildozer.spec
          
          # 2. تحديد المكتبات والمعمارية
          sed -i 's/^requirements =.*/requirements = python3,kivy,flask,numpy,opencv,requests/' buildozer.spec
          sed -i 's/^android.archs =.*/android.archs = arm64-v8a/' buildozer.spec
          
          # 3. إجبار Buildozer على استخدام NDK 25b المتوافق مع OpenCV
          sed -i 's/# android.ndk = 25b/android.ndk = 25b/' buildozer.spec
          sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
          
          # 4. بدء التجميع
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bin/*.apk
